services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-starter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cms_starter
    volumes:
      - cms_starter_pgdata:/var/lib/postgresql/data

volumes:
  cms_starter_pgdata:
